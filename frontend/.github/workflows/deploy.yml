name: Build and deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-app
  DEPLOY_HOST: 100.102.202.99
  DEPLOY_DIR: /opt/velstrong-book

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          known_hosts_tmp="$HOME/.ssh/known_hosts.tmp"
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 5 -H "$DEPLOY_HOST" > "$known_hosts_tmp" 2>/dev/null && test -s "$known_hosts_tmp"; then
              cat "$known_hosts_tmp" >> "$HOME/.ssh/known_hosts"
              rm -f "$known_hosts_tmp"
              break
            fi

            rm -f "$known_hosts_tmp"
            if [ "$attempt" -eq 12 ]; then
              echo "Unable to reach SSH host $DEPLOY_HOST after $attempt attempts"
              exit 1
            fi
            echo "SSH host not ready (attempt $attempt/12); retrying in 5 seconds"
            sleep 5
          done

      - name: Deploy frontend
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" <<EOF
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd "$DEPLOY_DIR"
            docker compose pull frontend
            docker compose up -d --no-deps frontend
          EOF
