name: Build and Deploy Space Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend
  DEPLOY_HOST: 100.102.202.99
  DEPLOY_DIR: /opt/space-book

jobs:
  build-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server (lab46)
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          known_hosts_tmp="$HOME/.ssh/known_hosts.tmp"
          for attempt in $(seq 1 12); do
            if ssh-keyscan -T 5 -H "$DEPLOY_HOST" > "$known_hosts_tmp" 2>/dev/null && test -s "$known_hosts_tmp"; then
              cat "$known_hosts_tmp" >> "$HOME/.ssh/known_hosts"
              rm -f "$known_hosts_tmp"
              break
            fi

            rm -f "$known_hosts_tmp"
            if [ "$attempt" -eq 12 ]; then
              echo "Unable to reach SSH host $DEPLOY_HOST after $attempt attempts"
              exit 1
            fi
            echo "SSH host not ready (attempt $attempt/12); retrying in 5 seconds"
            sleep 5
          done

      - name: Deploy Services via Docker Compose
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o ConnectTimeout=10 -o ConnectionAttempts=3 -i ~/.ssh/deploy_key root@"$DEPLOY_HOST" <<EOF
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd "$DEPLOY_DIR"
            docker compose pull backend frontend
            docker compose up -d --no-deps backend frontend
            docker compose ps
          EOF
