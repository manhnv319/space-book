name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-ci:
    name: Frontend (Lint, Typecheck, Unit Tests & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build Next.js application
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  backend-ci:
    name: Backend (Unit Tests, ArchUnit & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Backing Services (MongoDB rs0 & Redis)
        run: |
          docker compose up -d
          # Wait until MongoDB mongod process accepts commands
          timeout 30s bash -c 'until docker compose exec -T mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; do sleep 1; done'
          # Ensure replica set rs0 is initiated and Primary is writable
          docker compose exec -T mongo mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) }" || true
          timeout 30s bash -c 'until docker compose exec -T mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 1; done'

      - name: Run Maven Tests
        working-directory: backend
        run: ./mvnw test -B

      - name: Package Application
        working-directory: backend
        run: ./mvnw package -DskipTests -B
